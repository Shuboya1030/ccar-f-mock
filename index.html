<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F Diagnostic</title>
<style>
:root{
  --bg:#faf9f7; --card:#fff; --ink:#1f1e1c; --muted:#6b6862; --line:#e4e1db;
  --accent:#c96442; --accent-soft:#fdf3ef;
  --ok:#2f7d5d; --ok-soft:#eef7f2; --bad:#b4443a; --bad-soft:#fdf0ee;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
code{background:#f1efeb;padding:1px 5px;border-radius:4px;
  font:0.88em/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 100px}

header{border-bottom:1px solid var(--line);background:var(--card);margin-bottom:28px}
.hd{max-width:820px;margin:0 auto;padding:22px 20px}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13.5px}
.note{margin-top:12px;font-size:12.5px;color:var(--muted);
  border-left:3px solid var(--line);padding-left:11px}

.bar{position:sticky;top:0;z-index:10;background:rgba(250,249,247,.93);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:9px 0;margin-bottom:24px}
.bar-in{max-width:820px;margin:0 auto;padding:0 20px;
  display:flex;align-items:center;gap:14px;font-size:13.5px}
#clock{font:600 16px ui-monospace,Consolas,monospace;letter-spacing:.5px}
#clock.warn{color:var(--accent)}
#clock.over{color:var(--bad)}
.prog{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#count{color:var(--muted);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:6px 13px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
button.primary:hover{filter:brightness(1.06)}

.q{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:20px 22px;margin-bottom:16px}
.qh{display:flex;align-items:center;gap:9px;margin-bottom:11px;
  font-size:11.5px;color:var(--muted);letter-spacing:.3px}
.num{font-weight:600;color:var(--ink);font-size:13px}
.tag{background:#f1efeb;padding:2px 8px;border-radius:20px}
.tag.multi{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stem{margin-bottom:15px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;margin-bottom:7px;
  border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:.12s}
.opt:hover{background:#faf9f7}
.opt input{margin:4px 0 0;accent-color:var(--accent);flex-shrink:0}
.opt .k{font-weight:600;flex-shrink:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mark{margin-left:auto;font-size:12px;font-weight:600;flex-shrink:0}
.mark.r{color:var(--ok)} .mark.w{color:var(--bad)}

.exp{display:none;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.exp.on{display:block}
.verdict{font-weight:600;margin-bottom:12px;font-size:14px}
.verdict.r{color:var(--ok)} .verdict.w{color:var(--bad)}
.sec{margin-bottom:13px}
.sec h4{margin:0 0 5px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.scen{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.prin{border-left:3px solid var(--accent);padding-left:12px;font-style:italic}
.ww{margin:0;padding:0;list-style:none}
.ww li{margin-bottom:7px;padding-left:24px;position:relative}
.ww li b{position:absolute;left:0;color:var(--bad)}

#result{display:none;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:24px;margin-bottom:20px}
#result.on{display:block}
.score{font-size:38px;font-weight:600;line-height:1.1}
.score small{font-size:15px;color:var(--muted);font-weight:400}
.scaled{margin:6px 0 18px;font-size:14px}
.pill{display:inline-block;padding:2px 11px;border-radius:20px;font-size:13px;font-weight:600}
.pill.p{background:var(--ok-soft);color:var(--ok)}
.pill.f{background:var(--bad-soft);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:18px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.dbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px}
.dbar i{display:block;height:100%;background:var(--ok)}
.dbar i.low{background:var(--bad)}
.dbar i.mid{background:var(--accent)}
td.tag{font-size:12px;font-weight:600;color:var(--ok);white-space:nowrap}
td.tag.low{color:var(--bad)} td.tag.mid{color:var(--accent)}

/* share card — the unit that gets screenshotted */
.card{border-radius:14px;padding:30px 28px 22px;margin-bottom:10px;color:#fff;
  background:linear-gradient(150deg,#d4744f,#b8452f 62%,#8f3524)}
.card .ck{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;opacity:.72;margin-bottom:16px}
.card .big{font-size:27px;font-weight:600;line-height:1.25}
.card .big em{font-style:normal;font-size:56px;font-weight:700;letter-spacing:-1px}
.card .big em i{font-style:normal;font-size:26px;font-weight:600;margin-left:1px}
.card .chal{font-size:20px;font-weight:600;margin-top:6px}
.card .cmeta{font-size:13px;opacity:.72;margin-top:10px}
.card .cfoot{display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.22)}
.qr{display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11px;opacity:.8;text-align:center;max-width:104px}
.qr img,.qr .box{width:84px;height:84px;border-radius:8px;background:#fff;display:block}
.qr.ph .box{border:1px dashed rgba(255,255,255,.5);background:rgba(255,255,255,.1)}
.wm{text-align:right;font-size:12.5px;line-height:1.5;font-weight:600;opacity:.85}

.rh{font-size:14px;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.hint.mid{text-align:center}
ul.weak{list-style:none;margin:0;padding:0}
ul.weak li{border-left:3px solid var(--bad);background:var(--bad-soft);
  padding:11px 14px;border-radius:0 8px 8px 0;margin-bottom:9px;font-size:13.5px}
ul.weak li .n{color:var(--bad);font-weight:600;margin-left:5px}
ul.weak li .obj{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.7}
.sec.lock h4{color:var(--accent)}
.sec.lock{background:var(--accent-soft);border-radius:8px;padding:13px 15px}
#handoff{width:100%;font:12.5px/1.6 ui-monospace,Consolas,monospace;
  padding:11px;border:1px solid var(--line);border-radius:8px;background:#faf9f7;
  resize:vertical;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin:14px 0 7px}
.actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0}

#gate{position:fixed;inset:0;z-index:50;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:36px 34px;max-width:440px;width:100%;text-align:center}
#gate h2{margin:0 0 6px;font-size:20px}
#gate p{margin:0 0 24px;color:var(--muted);font-size:13.5px}
#gate .langs{display:flex;flex-direction:column;gap:10px}
#gate button{padding:14px 18px;font-size:15px;text-align:left;
  display:flex;align-items:baseline;gap:10px}
#gate button b{font-weight:600}
#gate button span{color:var(--muted);font-size:12.5px}
body.gated{overflow:hidden}
</style>
</head>
<body class="gated">

<div id="gate"><div class="box">
  <h2 id="gt"></h2>
  <p id="gp"></p>
  <div class="langs" id="gl"></div>
</div></div>

<div id="app" hidden>
<header><div class="hd">
  <h1 id="t"></h1>
  <div class="sub" id="st"></div>
  <div class="note" id="dc"></div>
</div></header>

<div class="bar"><div class="bar-in">
  <span id="clock">40:00</span>
  <button id="pause">​</button>
  <div class="prog"><i id="pb"></i></div>
  <span id="count">0 / 0</span>
  <button id="submit" class="primary"></button>
</div></div>

<div class="wrap">
  <div id="result"></div>
  <div id="qs"></div>
  <footer id="ft"></footer>
</div>
</div>

const LANGS = BUNDLE.languages;
const $$ = s => document.querySelector(s);
$$('#gt').textContent = BUNDLE.gate.title;
$$('#gp').textContent = BUNDLE.gate.subtitle;
$$('#gl').innerHTML = LANGS.map(l =>
  `<button data-lang="${l.code}"><b>${l.label}</b><span>${l.note}</span></button>`).join('');
function choose(code){
  try { localStorage.setItem('ccarLang', code); } catch (_) {}
  const g = $$('#gate'); if (g) g.remove();
  document.body.classList.remove('gated');
  $$('#app').hidden = false;
  start(code);
}
let saved = null;
try { saved = localStorage.getItem('ccarLang'); } catch (_) {}
if (LANGS.length === 1) choose(LANGS[0].code);
else if (saved && BUNDLE.banks[saved]) choose(saved);

$$('#gl').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (!b) return;
  choose(b.dataset.lang);
});

  qrCaption:'Scan to take the test',
  saveHint:'Long-press to save, or screenshot and share.',
  breakdown:'By domain',
  pctLabel:'correct',
  weakTitle:'Your weak spots',
  weakNone:'No domain fell below the line — nothing stands out as weak.',
  weakLead:'These domains pulled your score down. Start here:',
  sampleUnlocked:'Full explanation · unlocked',
  locked:'Explanation locked',
  lockedBody:'Full explanations for all items are posted on my feed, one or two per post.',
  strong:'strong', weak:'needs work', mixed:'mixed'
}, BANK.ui || {});
const picks = {};          // id -> Set of keys
let graded = false, left = BANK.meta.timeLimitMinutes * 60, timer = null, running = true;

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- header ---------- */
document.documentElement.lang = BANK.meta.lang || 'en';
document.title = BANK.meta.title + ' · ' + BANK.meta.examCode;
$('#t').textContent = BANK.meta.title;
$('#st').textContent = BANK.meta.subtitle + ' · ' + BANK.meta.timeLimitMinutes + ' ' + UI.minutes;
$('#dc').innerHTML = esc(BANK.meta.disclaimer) + '<br>' + esc(BANK.meta.passingNote);
$('#pause').textContent=UI.pause;$('#submit').textContent=UI.submit;
$('#ft').innerHTML = esc(BANK.meta.examCode + ' · ' + BANK.meta.id) +
  (LANGS.length > 1 ? ' · <a href="#" id="lang" style="color:inherit">' + esc(UI.switchLang) + '</a>' : '');
if (LANGS.length > 1) $('#lang').onclick = e => {
  e.preventDefault();
  try { localStorage.removeItem('ccarLang'); } catch (_) {}
  location.reload();
};

/* ---------- render ---------- */
$('#qs').innerHTML = Q.map(q => {
  const multi = q.type === 'multi';
  const need = multi ? q.answer.length : 1;
  return `<div class="q" id="q${q.id}">
    <div class="qh">
      <span class="num">Q${q.id}</span>
      <span class="tag">${q.domain} · ${BANK.domains[q.domain].name}</span>
      ${multi ? `<span class="tag multi">SELECT ${need}</span>` : ''}
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${q.options.map(o => `
      <label class="opt" data-q="${q.id}" data-k="${o.key}">
        <input type="${multi ? 'checkbox' : 'radio'}" name="q${q.id}" value="${o.key}">
        <span class="k">${o.key}.</span><span>${o.text}</span>
      </label>`).join('')}
    </div>
    <div class="exp" id="e${q.id}"></div>
  </div>`;
}).join('');

/* ---------- selection ---------- */
picks[0] = null;
Q.forEach(q => picks[q.id] = new Set());

$('#qs').addEventListener('change', e => {
  if (graded) return;
  const lab = e.target.closest('.opt');
  if (!lab) return;
  const id = +lab.dataset.q, k = lab.dataset.k, q = Q.find(x => x.id === id);
  if (q.type === 'multi') {
    e.target.checked ? picks[id].add(k) : picks[id].delete(k);
  } else {
    picks[id] = new Set([k]);
  }
  document.querySelectorAll(`.opt[data-q="${id}"]`).forEach(l =>
    l.classList.toggle('sel', picks[id].has(l.dataset.k)));
  progress();
});

function answered(){ return Q.filter(q => picks[q.id].size > 0).length; }
function progress(){
  const a = answered();
  $('#count').textContent = a + ' / ' + N;
  $('#pb').style.width = (a / N * 100) + '%';
}
progress();

/* ---------- timer ---------- */
function paint(){
  const s = Math.abs(left), m = Math.floor(s / 60), ss = s % 60;
  const c = $('#clock');
  c.textContent = (left < 0 ? '+' : '') + m + ':' + String(ss).padStart(2, '0');
  c.className = left < 0 ? 'over' : left <= 300 ? 'warn' : '';
}
paint();
timer = setInterval(() => { if (running && !graded) { left--; paint(); } }, 1000);
$('#pause').onclick = () => { running = !running; $('#pause').textContent = running ? UI.pause : UI.resume; };

/* ---------- grading ---------- */
const same = (a, b) => a.size === b.length && b.every(k => a.has(k));

$('#submit').onclick = () => {
  if (graded) { location.reload(); return; }
  const miss = N - answered();
  if (miss && !confirm(miss + ' ' + UI.unanswered)) return;
  grade();
};

function grade(){
  graded = true; running = false; clearInterval(timer);
  $('#submit').textContent = UI.restart;
  $('#pause').disabled = true;

  const byDomain = {}, wrongIds = [];
  Object.keys(BANK.domains).forEach(d => byDomain[d] = { got: 0, tot: 0, wrong: [] });

  Q.forEach(q => {
    const mine = picks[q.id], ok = same(mine, q.answer);
    const d = byDomain[q.domain];
    d.tot++; if (ok) d.got++; else { d.wrong.push(q.id); wrongIds.push(q.id); }

    document.querySelectorAll(`.opt[data-q="${q.id}"]`).forEach(l => {
      const k = l.dataset.k, isA = q.answer.includes(k), isM = mine.has(k);
      l.classList.remove('sel');
      l.querySelector('input').disabled = true;
      if (isA) l.classList.add('right');
      else if (isM) l.classList.add('wrong');
      if (isA || isM) {
        const m = document.createElement('span');
        m.className = 'mark ' + (isA ? 'r' : 'w');
        m.textContent = isA ? (isM ? '✓ '+UI.markCorrect+' · '+UI.markPicked : '✓ '+UI.markCorrect) : '✗ '+UI.markPicked;
        l.appendChild(m);
      }
    });

    const wrongOpts = q.options.filter(o => !q.answer.includes(o.key));
    const locked = LOCK && !SAMPLE_IDS.includes(q.id);
    $('#e' + q.id).innerHTML = locked ? `
      <div class="verdict ${ok ? 'r' : 'w'}">${ok ? '✓ '+UI.correct : '✗ '+UI.incorrect} · ${UI.answerLbl}: ${q.answer.join(', ')}${mine.size ? ' · '+UI.youLbl+': ' + [...mine].sort().join(', ') : ' · '+UI.noAnswer}</div>
      <div class="sec lock"><h4>🔒 ${UI.locked}</h4><div>${UI.lockedBody}${AUTHOR.handle ? ` <b>${esc(AUTHOR.handle)}</b>` : ''}</div></div>` : `
      ${LOCK ? `<div class="sec"><h4>${UI.sampleUnlocked}</h4></div>` : ''}
      <div class="verdict ${ok ? 'r' : 'w'}">${ok ? '✓ '+UI.correct : '✗ '+UI.incorrect} · ${UI.answerLbl}: ${q.answer.join(', ')}${mine.size ? ' · '+UI.youLbl+': ' + [...mine].sort().join(', ') : ' · '+UI.noAnswer}</div>
      <div class="sec"><h4>${UI.concept}</h4>${q.objective ? `<div class="scen">${UI.objectiveLbl}: ${q.objective}</div>` : ''}<div>${q.concept}</div></div>
      <div class="sec"><h4>${UI.whyCorrect}</h4><div>${q.whyCorrect}</div></div>
      <div class="sec"><h4>${UI.whyWrong}</h4><ul class="ww">${
        wrongOpts.map(o => `<li><b>${o.key}</b>${q.whyWrong[o.key] || ''}</li>`).join('')
      }</ul></div>
      ${q.principle ? `<div class="sec"><h4>${UI.principle}</h4><div class="prin">${q.principle}</div></div>` : ''}`;
    $('#e' + q.id).classList.add('on');
  });

  const raw = N - wrongIds.length;
  const pct = raw / N;
  const pctInt = Math.round(pct * 100);
  const used = BANK.meta.timeLimitMinutes * 60 - left;
  const mm = Math.floor(Math.abs(used) / 60), ssx = Math.abs(used) % 60;

  const rows = Object.keys(BANK.domains).map(d => {
    const x = byDomain[d], p = x.tot ? x.got / x.tot : 0;
    const cls = p < 0.5 ? 'low' : p < 0.75 ? 'mid' : '';
    const tag = p >= 0.75 ? UI.strong : p < 0.5 ? UI.weak : UI.mixed;
    return `<tr>
      <td><b>${d}</b> ${BANK.domains[d].name}</td>
      <td class="n">${x.got}/${x.tot}</td>
      <td style="width:110px"><div class="dbar"><i class="${cls}" style="width:${p*100}%"></i></div></td>
      <td class="n tag ${cls}">${tag}</td>
    </tr>`;
  }).join('');

  /* Weak spots: domains under 75%, worst first. Names the objectives actually
     missed, so the list points at something specific rather than a bar. */
  const weak = Object.keys(BANK.domains)
    .map(d => ({ d, x: byDomain[d], p: byDomain[d].tot ? byDomain[d].got / byDomain[d].tot : 1 }))
    .filter(o => o.p < 0.75)
    .sort((a, b) => a.p - b.p);
  const weakHtml = weak.length ? `
    <div class="hint">${UI.weakLead}</div>
    <ul class="weak">${weak.map(o => `<li>
      <b>${BANK.domains[o.d].name}</b> <span class="n">${o.x.got}/${o.x.tot}</span>
      <div class="obj">${o.x.wrong.map(id => {
        const q = Q.find(t => t.id === id);
        return `Q${id} · ${q.objective || ''}`;
      }).join('<br>')}</div>
    </li>`).join('')}</ul>` : `<div class="hint">${UI.weakNone}</div>`;

  const qr = AUTHOR.qr
    ? `<div class="qr"><img src="${esc(AUTHOR.qr)}" alt=""><span>${UI.qrCaption}</span></div>`
    : `<div class="qr ph"><div class="box"></div><span>${UI.qrCaption}</span></div>`;

  const handoff =
    'CCAR-F ' + BANK.meta.id + ' | score ' + raw + '/' + N +
    ' (' + pctInt + '%) | time ' + mm + 'm' + ssx + 's\n' +
    Q.map(q => 'Q' + q.id + ':' + ([...picks[q.id]].sort().join('') || '-') +
      (same(picks[q.id], q.answer) ? '' : '(x,ans=' + q.answer.join('') + ',' + q.domain + ')')).join(' ');

  $('#result').innerHTML = `
    <div class="card" id="card">
      <div class="ck">${UI.cardKicker}</div>
      <div class="big">${UI.cardTitle.replace('{p}', `<em>${pctInt}<i>%</i></em>`)}</div>
      <div class="chal">${UI.cardChallenge}</div>
      <div class="cmeta">${UI.cardMeta.replace('{n}', N).replace('{mm}', mm).replace('{ss}', ssx)}</div>
      <div class="cfoot">
        ${qr}
        <div class="wm">${esc(BANK.meta.examCode)}<br>${AUTHOR.handle ? esc(AUTHOR.handle) : ''}</div>
      </div>
    </div>
    <div class="hint mid">${UI.saveHint}</div>

    <h3 class="rh">${UI.breakdown}</h3>
    <div class="scaled"><b>${raw} / ${N}</b> ${UI.pctLabel}
      &nbsp;·&nbsp; <span style="color:var(--muted)">${UI.timeUsed} ${mm}m ${ssx}s</span></div>
    <table><tbody>${rows}</tbody></table>

    <h3 class="rh">${UI.weakTitle}</h3>
    ${weakHtml}

    <div class="hint">${UI.handoffHint}</div>
    <textarea id="handoff" rows="5" readonly>${esc(handoff)}</textarea>
    <div class="actions"><button id="copy" class="primary"></button></div>`;
  $('#result').classList.add('on');
  $('#copy').textContent=UI.copy;

  $('#copy').onclick = () => {
    const t = $('#handoff'); t.select();
    navigator.clipboard.writeText(t.value).then(
      () => $('#copy').textContent = UI.copied,
      () => document.execCommand('copy'));
  };
  scrollTo({ top: 0, behavior: 'smooth' });
}
}
</script>
</body>
</html>
